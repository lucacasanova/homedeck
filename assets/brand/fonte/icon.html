<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
html,body{background:transparent}
#stage{position:relative;overflow:hidden}
.ic{position:absolute;overflow:hidden;isolation:isolate}
.ic canvas.bg{position:absolute;inset:-6%;width:112%;height:112%}
.ic .gl{position:absolute;inset:0;border-radius:inherit;pointer-events:none}
.ic .mk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.word{font-weight:500;color:#fff}
</style></head><body>
<div id="stage"></div>
<script src="common.js"></script>
<script>
const q=new URLSearchParams(location.search);
const v=q.get('v')||'glass', W=+(q.get('w')||1024), H=+(q.get('h')||W);
const stage=document.getElementById('stage');stage.style.width=W+'px';stage.style.height=H+'px';

function scene(canvas,S,blur){ // S = px size of square world
  const k=S/1000;
  drawScene(canvas,{W:Math.round(S),H:Math.round(S),k,worldW:1000,worldH:1000,stars:!blur,vignette:.35,
    glows:[{x:700,y:260,r:950,a:.40}],
    moon:{x:735,y:235,r:175,a:.95},
    ridges:[
      {y:690,amp:150,freq:.0024,seed:11,color:'#1e1e22',colorTop:'#3a3a41',mist:.12,rim:.16},
      {y:790,amp:110,freq:.0033,seed:23,color:'#141417',colorTop:'#26262b',mist:.08,rim:.08},
      {y:890,amp:80,freq:.0045,seed:37,color:'#0d0d10',colorTop:'#18181c',mist:.05},
      {y:970,amp:45,freq:.006,seed:51,color:'#070708',colorTop:'#0d0d0f'}]});
  if(blur)canvas.style.filter=`blur(${blur}px) brightness(1.05)`;
}
// glass tile: x,y,size, radius
function glassTile(x,y,S,R,{markScale=.56,flat=false,stroke=58,markY=0}={}){
  const d=document.createElement('div');d.className='ic';
  Object.assign(d.style,{left:x+'px',top:y+'px',width:S+'px',height:S+'px',borderRadius:R+'px'});
  if(flat){
    d.style.background='linear-gradient(160deg,#34343a 0%,#1a1a1e 48%,#0b0b0d 100%)';
    d.innerHTML=`<div class="gl" style="box-shadow:inset 0 ${Math.max(1,S*.004)}px 0 rgba(255,255,255,.28),inset 0 0 0 ${Math.max(1,S*.003)}px rgba(255,255,255,.10)"></div>`;
  }else{
    const c=document.createElement('canvas');c.className='bg';d.appendChild(c);scene(c,S*1.12,S*.03);
    d.insertAdjacentHTML('beforeend',`
      <div class="gl" style="background:linear-gradient(155deg,rgba(255,255,255,.16),rgba(255,255,255,.03) 45%,rgba(255,255,255,.07))"></div>
      <div class="gl" style="background:radial-gradient(110% 60% at 15% -5%,rgba(255,255,255,.22),transparent 55%)"></div>
      <div class="gl" style="padding:${S*.0045}px;background:linear-gradient(140deg,rgba(255,255,255,.85),rgba(255,255,255,.12) 30%,rgba(255,255,255,.03) 55%,rgba(255,255,255,.14) 80%,rgba(255,255,255,.5));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude"></div>`);
  }
  const m=document.createElement('div');m.className='mk';m.style.transform=`translateY(${markY*S}px)`;
  m.innerHTML=markSVG(S*markScale,{stroke});
  const svg=m.querySelector('svg');
  if(!flat)svg.style.filter=`drop-shadow(0 0 ${S*.03}px rgba(255,255,255,.35)) drop-shadow(0 ${S*.012}px ${S*.02}px rgba(0,0,0,.35))`;
  d.appendChild(m);stage.appendChild(d);return d;
}

if(v==='glass')       glassTile(W*.0977,W*.0977,W*.8047,W*.18);          // macOS-style grid 824/1024
if(v==='glass-full')  glassTile(0,0,W,0);
if(v==='glass-round') glassTile(0,0,W,W/2,{markScale:.5});
if(v==='flat')        glassTile(0,0,W,W*.22,{markScale:.74,stroke:78,flat:true,markY:.01});
if(v==='flat-full')   glassTile(0,0,W,0,{markScale:.62,flat:true});
if(v==='bg'){const d=glassTile(0,0,W,0);d.querySelector('.mk').remove();}
if(v==='fg'||v==='mono'){ // adaptive icon foreground: mark within 66dp safe zone of 108dp
  const m=document.createElement('div');m.className='ic';Object.assign(m.style,{left:0,top:0,width:W+'px',height:W+'px'});
  m.innerHTML=`<div class="mk">${markSVG(W*.41)}</div>`;
  if(v==='fg')m.querySelector('svg').style.filter=`drop-shadow(0 0 ${W*.02}px rgba(255,255,255,.3)) drop-shadow(0 ${W*.008}px ${W*.014}px rgba(0,0,0,.35))`;
  stage.appendChild(m);
}
if(v==='banner'){ // TV banner (16:9): glass background + lockup
  const d=document.createElement('div');d.className='ic';Object.assign(d.style,{left:0,top:0,width:W+'px',height:H+'px'});
  const c=document.createElement('canvas');c.className='bg';d.appendChild(c);
  drawScene(c,{W:Math.round(W*1.12),H:Math.round(H*1.12),k:W*1.12/1600,worldW:1600,worldH:900,stars:false,vignette:.4,
    glows:[{x:1150,y:300,r:1200,a:.38}],moon:{x:1240,y:250,r:150,a:.9},
    ridges:[{y:620,amp:150,freq:.0018,seed:11,color:'#1e1e22',colorTop:'#3a3a41',mist:.12,rim:.16},
      {y:720,amp:110,freq:.0026,seed:23,color:'#141417',colorTop:'#26262b',mist:.08},
      {y:820,amp:70,freq:.0036,seed:37,color:'#0b0b0d',colorTop:'#18181c'}]});
  c.style.filter=`blur(${W*.012}px)`;
  d.insertAdjacentHTML('beforeend',`<div class="gl" style="background:linear-gradient(155deg,rgba(255,255,255,.12),rgba(255,255,255,.02) 50%,rgba(255,255,255,.05))"></div>
   <div class="mk" style="gap:${W*.035}px">${markSVG(W*.17)}<span class="word" style="font-size:${W*.115}px;letter-spacing:${-W*.003}px">homedeck</span></div>`);
  d.querySelector('svg').style.filter=`drop-shadow(0 0 ${W*.015}px rgba(255,255,255,.35))`;
  stage.appendChild(d);
}
if(v==='tizen'){ // 512x423-style: icon tile centered on transparent
  const S=Math.min(W,H)*.86;glassTile((W-S)/2,(H-S)/2,S,S*.2);
}
</script></body></html>
