[package]
name = "homedeck-app"
description = "homedeck desktop and mobile shell (Tauri 2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[lib]
# `_lib` suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "homedeck_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
homedeck-core = { path = "../../../crates/core" }
log = "0.4"
tauri-plugin-log = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", default-features = false, features = ["hostname", "signal", "user"] }
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }
signal-hook = "0.4"

[features]
# Enables HOMEDECK_TEST_CRASH_MODES (simulated crashes for supervisor tests). Never in releases.
test-hooks = []
