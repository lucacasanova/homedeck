name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Tauri 2 build dependencies on Ubuntu (https://v2.tauri.app/start/prerequisites/)
  LINUX_DEPS: >-
    libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev
    libayatana-appindicator3-dev librsvg2-dev patchelf

jobs:
  # Decides which jobs this change needs. Skipped jobs count as passing for
  # branch protection, so docs-only PRs do not run builds. Pushes to main run
  # everything (keeps a fresh AppImage artifact for testing).
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.f.outputs.rust }}
      js: ${{ steps.f.outputs.js }}
      app: ${{ steps.f.outputs.app }}
      deps: ${{ steps.f.outputs.deps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: f
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          all() { for k in rust js app deps; do echo "$k=true" >> "$GITHUB_OUTPUT"; done; exit 0; }
          [[ "$EVENT" != "pull_request" || -z "$BASE" ]] && all
          files=$(git diff --name-only "$BASE" HEAD)
          echo "$files"
          grep -qE '^\.github/workflows/ci\.yml$' <<<"$files" && all
          has() { grep -qE "$1" <<<"$files" && echo "$2=true" || echo "$2=false"; }
          {
            has '^(crates/|apps/desktop-mobile/src-tauri/|Cargo\.(toml|lock)$|rust-toolchain\.toml$)' rust
            has '^(apps/|packages/|scripts/|site/|package\.json$|pnpm-(lock|workspace)\.yaml$|tsconfig|eslint\.config|\.prettier)' js
            has '^(crates/|apps/desktop-mobile/|packages/|Cargo\.(toml|lock)$|pnpm-lock\.yaml$|assets/brand/(tauri|linux|logo)/)' app
            has '(^|/)Cargo\.(toml|lock)$|^deny\.toml$' deps
          } >> "$GITHUB_OUTPUT"

  rust:
    name: Rust (fmt, clippy, test)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_DEPS
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Placeholder frontend dist (tauri::generate_context needs it)
        run: mkdir -p apps/desktop-mobile/dist && touch apps/desktop-mobile/dist/index.html
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  js:
    name: JS (lint, types, test)
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  supply-chain:
    name: Supply chain (cargo-deny)
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  build-linux:
    name: Build Linux (AppImage, deb)
    needs: [changes, rust, js]
    # Runs when the app changed, even if one of rust/js was skipped (not failed).
    if: needs.changes.outputs.app == 'true' && !failure() && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_DEPS
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tauri build
        working-directory: apps/desktop-mobile
        run: pnpm tauri build --bundles appimage deb
      - name: Drop bundled libwayland from the AppImage (#158)
        run: bash scripts/fix-appimage.sh target/release/bundle/appimage/*.AppImage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homedeck-linux-${{ github.sha }}
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14
