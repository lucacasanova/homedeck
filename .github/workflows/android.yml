name: Android

# Debug APK of the Tauri shell (issue #6). Separate from ci.yml until the
# Android build is stable; M4 commits the generated project (leanback, icons).
on:
  pull_request:
    paths: ["apps/desktop-mobile/**", "crates/**", "packages/**", "Cargo.*", "pnpm-lock.yaml", ".github/workflows/android.yml"]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build Android (APK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Rust toolchain + Android target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Android project and build debug APK
        working-directory: apps/desktop-mobile
        run: |
          # Runner variables are not visible in the `env` context; export here.
          export NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK_HOME=$NDK_HOME"
          pnpm tauri android init --ci
          pnpm tauri android build --debug --apk --target aarch64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homedeck-android-${{ github.sha }}
          path: apps/desktop-mobile/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
