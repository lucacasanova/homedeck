name: Ideia / funcionalidade
description: Sugira algo novo
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes: { label: Qual problema resolve }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposta }
  - type: dropdown
    id: phase
    attributes:
      label: Fase do roadmap
      options: [Não sei, "0", "1", "2", "3", "4", "5", "6", "7"]
